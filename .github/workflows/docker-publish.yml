name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated)'
        required: false
        default: 'server,dashboard,workflows,private-location,status-page,checker'
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: openstatus

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine services to build
        id: set-services
        run: |
          SERVICES=$(echo "${{ inputs.services }}" | tr ',' '\n' | jq -R . | jq -sc .)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Building services: $SERVICES"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.services != '[]'
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
        include:
          - service: server
            context: .
            dockerfile: apps/server/Dockerfile
            timeout: 30
          - service: dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
            timeout: 50
          - service: workflows
            context: .
            dockerfile: apps/workflows/Dockerfile
            timeout: 30
          - service: private-location
            context: apps/private-location
            dockerfile: apps/private-location/Dockerfile
            timeout: 30
          - service: status-page
            context: .
            dockerfile: apps/status-page/Dockerfile
            timeout: 50
          - service: checker
            context: apps/checker
            dockerfile: apps/checker/Dockerfile
            timeout: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30
